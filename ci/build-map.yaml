version: 1

targets:
  kernel:
    script: build-scripts/build-kernel.sh

  kernel-stable:
    script: build-scripts/build-kernel-stable.sh

  gpu-dkms:
    script: build-scripts/build-gpu-dkms.sh
    control: debian/gpu-dkms/control

  vpu-dkms:
    script: build-scripts/build-vpu-dkms.sh
    control: debian/vpu-dkms/control

  vpu-firmware:
    script: build-scripts/build-vpu-firmware.sh
    control: debian/vpu-firmware/control

  npu-dkms:
    script: build-scripts/build-npu-dkms.sh
    control: debian/npu-dkms/control

  grub-config:
    script: build-scripts/build-grub-config.sh
    control: debian/grub-config/control

projects:
  cix_opensource/linux:
    path: sources/linux
    rules:
      - paths: ["**"]
        targets: [kernel]

  cix-linux-kernel:
    path: sources/linux-stable
    rules:
      - paths: ["**"]
        targets: [kernel-stable]

  cix-linux-main:
    path: sources/linux-main
    rules:
      - paths: ["**"]
        targets: [kernel-stable]

  cix_opensource/gpu_kernel:
    path: sources/gpu-kernel
    rules:
      - paths: ["**"]
        targets: [gpu-dkms]

  cix_opensource/vpu_driver:
    path: sources/vpu-driver
    rules:
      - paths: ["**"]
        targets: [vpu-dkms]

  cix_proprietary/cix_proprietary:
    path: sources/cix-proprietary
    rules:
      - paths: ["**"]
        targets: [vpu-firmware]

  cix_opensource/npu_driver:
    path: sources/npu-driver
    rules:
      - paths: ["**"]
        targets: [npu-dkms]

  cix-neo-build-scripts:
    path: build-scripts
    rules:
      - paths: ["build-kernel.sh"]
        targets: [kernel]
      - paths: ["build-kernel-stable.sh"]
        targets: [kernel-stable]
      - paths: ["build-gpu-dkms.sh"]
        targets: [gpu-dkms]
      - paths: ["build-vpu-dkms.sh"]
        targets: [vpu-dkms]
      - paths: ["build-vpu-firmware.sh"]
        targets: [vpu-firmware]
      - paths: ["build-npu-dkms.sh"]
        targets: [npu-dkms]
      - paths: ["build-dkms-package.sh"]
        targets: [gpu-dkms, vpu-dkms, npu-dkms]
      - paths: ["build-grub-config.sh", "build-native-package.sh"]
        targets: [grub-config]
      - paths: ["sbuild/**"]
        targets: [gpu-dkms, vpu-dkms, vpu-firmware, npu-dkms, grub-config]
      - paths: ["setup-sbuild.sh"]
        targets: [kernel, gpu-dkms, vpu-dkms, vpu-firmware, npu-dkms, grub-config]
      - paths: ["test-gpu-dkms.sh"]
        targets: [kernel, gpu-dkms]
      - paths: ["test-vpu-dkms.sh"]
        targets: [kernel, vpu-dkms]
      - paths: ["test-npu-dkms.sh"]
        targets: [kernel, npu-dkms]
      - paths: ["test-dkms-package.sh"]
        targets: [kernel, gpu-dkms, vpu-dkms, npu-dkms]
      - paths: ["framework.sh"]
        targets: [kernel, kernel-stable, gpu-dkms, vpu-dkms, vpu-firmware, npu-dkms, grub-config]
    ignore:
      - ".gitignore"
      - "README.md"
      - "ci/**"
      - "docs/**"

  cix-neo-debian:
    path: debian
    rules:
      - paths: ["kernel/**"]
        targets: [kernel]
      - paths: ["gpu-dkms/**"]
        targets: [gpu-dkms]
      - paths: ["vpu-dkms/**"]
        targets: [vpu-dkms]
      - paths: ["vpu-firmware/**"]
        targets: [vpu-firmware]
      - paths: ["npu-dkms/**"]
        targets: [npu-dkms]
      - paths: ["grub-config/**"]
        targets: [grub-config]
    ignore:
      - "README.md"
