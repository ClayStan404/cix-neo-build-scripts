version: 7
executor: build-scripts/cix-build

build_sets:
  secure-firmware:
    description: Native ARM64 secure-firmware components
    targets:
      - uefi-stmm
      - sky1-optee
      - sky1-pbl
      - sky1-tf-a
      - sky1-se-firmware

  sky1-trusted-firmware:
    description: Native Sky1 PBL and TF-A firmware
    targets:
      - sky1-pbl
      - sky1-tf-a

  uefi-development:
    description: Native ARM64 development UEFI matrix for CIX validation platforms
    targets: &uefi_development_targets
      - sky1-emu-uefi
      - sky1-fpga-uefi
      - sky1-merak-uefi
      - sky1p-emu-uefi
      - sky1p-fpga-uefi
      - sky1p-evb-uefi
      - sky1p-crb1-uefi
      - sky1p-crb2-uefi
      - star1-emu-uefi
      - star1-fpga-uefi
      - star1-merak-uefi

  firmware-sky1:
    description: All native ARM64 Sky1 product firmware variants
    targets:
      - radxa-o6-firmware
      - radxa-o6n-firmware
      - sky1-merak-firmware
      - sky1-edge-firmware

  firmware-engineering:
    description: O6 engineering firmware and PM inspection tool
    targets:
      - pmtool
      - radxa-o6-firmware-engineering

  diagnostics:
    description: Native ARM64 post-mortem diagnostic tools
    targets:
      - ramparser

  validation-tools:
    description: Native ARM64 platform and kernel validation tools
    targets:
      - cix-test-tools
      - ltp

  all-6.6:
    description: Complete CIX Linux 6.6 product build
    targets:
      - kernel
      - audio-sof
      - radxa-o6-firmware
      - radxa-o6n-firmware
      - gpu-dkms
      - bt-dkms
      - vpu-dkms
      - vpu-firmware
      - npu-dkms
      - grub-config
      - alsa-conf
      - cix-env
      - cix-firmware
      - audio-dsp
      - dpu-ddk
      - gpu-umd
      - isp-umd
      - libdrm
      - libglvnd
      - mesa
      - libva
      - ffmpeg
      - libcme
      - cix-vaapi
      - isp-v4l2-dkms
      - isp-dkms
      - noe-umd
      - npu-umd
      - ai-engine
      - mnn
      - gstreamer-6.6
      - nnstreamer
      - wlan-dkms

  all-7.0:
    description: CIX Linux 7.0 kernel, VPU, boot, and GStreamer build
    targets:
      - stable-kernel
      - vpu-dkms
      - vpu-firmware
      - grub-config
      - gstreamer-base-7.0
      - gstreamer-good-7.0

targets:
  kernel:
    description: CIX 6.6 development kernel
    builder: direct
    flow: kernel-worktree
    source: sources/linux
    debian: debian/kernel
    build_packages: [cix-linux-libc-dev]

  stable-kernel:
    description: Latest stable kernel with CIX patches
    builder: direct
    flow: kernel-stable-tarball
    version: 7.0.13
    patch_source: sources/linux-main

  audio-sof:
    description: CIX Sound Open Firmware
    builder: direct
    flow: sof-firmware
    source: sources/audio-sof
    debian: debian/audio-sof
    build_packages: [cix-audio-sof]

  radxa-o6-firmware:
    description: Radxa Orion O6 platform firmware images
    builder: direct
    flow: sky1-firmware
    source: sources/radxa-o6
    board: O6

  radxa-o6n-firmware:
    description: Radxa Orion O6N platform firmware images
    builder: direct
    flow: sky1-firmware
    source: sources/radxa-o6
    board: O6N

  sky1-merak-firmware:
    description: CIX Sky1 Merak EVB platform firmware images
    builder: direct
    flow: sky1-firmware
    source: sources/radxa-o6
    board: Merak

  sky1-edge-firmware:
    description: CIX Sky1 Edge platform firmware images
    builder: direct
    flow: sky1-firmware
    source: sources/radxa-o6
    board: Edge

  sky1-emu-uefi:
    description: CIX Sky1 Emu development UEFI image
    builder: direct
    flow: uefi-development
    source: sources/uefi-development
    board: Sky1-Emu

  sky1-fpga-uefi:
    description: CIX Sky1 FPGA development UEFI image
    builder: direct
    flow: uefi-development
    source: sources/uefi-development
    board: Sky1-Fpga

  sky1-merak-uefi:
    description: CIX Sky1 Merak development UEFI image
    builder: direct
    flow: uefi-development
    source: sources/uefi-development
    board: Sky1-Merak

  sky1p-emu-uefi:
    description: CIX Sky1P Emu development UEFI image
    builder: direct
    flow: uefi-development
    source: sources/uefi-development
    board: Sky1P-Emu

  sky1p-fpga-uefi:
    description: CIX Sky1P FPGA development UEFI image
    builder: direct
    flow: uefi-development
    source: sources/uefi-development
    board: Sky1P-Fpga

  sky1p-evb-uefi:
    description: CIX Sky1P EVB development UEFI image
    builder: direct
    flow: uefi-development
    source: sources/uefi-development
    board: Sky1P-Evb

  sky1p-crb1-uefi:
    description: CIX Sky1P CRB1 development UEFI image
    builder: direct
    flow: uefi-development
    source: sources/uefi-development
    board: Sky1P-Crb1

  sky1p-crb2-uefi:
    description: CIX Sky1P CRB2 development UEFI image
    builder: direct
    flow: uefi-development
    source: sources/uefi-development
    board: Sky1P-Crb2

  star1-emu-uefi:
    description: CIX Star1 Emu development UEFI image
    builder: direct
    flow: uefi-development
    source: sources/uefi-development
    board: Star1-Emu

  star1-fpga-uefi:
    description: CIX Star1 FPGA development UEFI image
    builder: direct
    flow: uefi-development
    source: sources/uefi-development
    board: Star1-Fpga

  star1-merak-uefi:
    description: CIX Star1 Merak development UEFI image
    builder: direct
    flow: uefi-development
    source: sources/uefi-development
    board: Star1-Merak

  uefi-stmm:
    description: CIX Sky1 Standalone MM firmware
    builder: direct
    flow: uefi-stmm
    source: sources/uefi-stmm

  sky1-tf-a:
    description: CIX Sky1 EL3 runtime firmware
    builder: direct
    flow: sky1-tf-a
    source: sources/secure-firmware

  sky1-pbl:
    description: CIX Sky1 primary bootloader firmware
    builder: direct
    flow: sky1-pbl
    source: sources/secure-firmware

  sky1-optee:
    description: CIX Sky1 OP-TEE secure-world firmware
    builder: direct
    flow: sky1-optee
    source: sources/secure-firmware

  sky1-se-firmware:
    description: CIX Sky1 security-engine firmware
    builder: direct
    flow: sky1-se-firmware
    source: sources/radxa-o6

  radxa-o6-firmware-engineering:
    description: Radxa Orion O6 engineering firmware with BIOS-selectable CPU and memory tuning
    builder: direct
    flow: sky1-firmware-engineering
    source: sources/radxa-o6
    board: O6

  pmtool:
    description: CIX CSU PM firmware inspection tool
    builder: direct
    flow: pmtool
    source: sources/cix-binary

  ramparser:
    description: CIX native ARM64 crash and ramdump parser
    builder: direct
    flow: ramparser
    header_revision: 1e7a5a340385ee307e8711f6acdc72618fb1f042
    source: sources/ramparser
    source_overlays:
      - sources/linux=kernel

  cix-test-tools:
    description: Selected CIX native hardware validation tools
    builder: direct
    flow: cix-test-tools
    source: sources/cix-unit-test

  ltp:
    description: CIX-pinned Linux Test Project suite
    builder: direct
    flow: ltp-testsuite
    source: sources/ltp

  gpu-dkms:
    description: GPU DKMS package
    builder: debian
    flow: quilt
    source: sources/gpu-kernel
    source_git: sources/gpu-kernel
    debian: debian/gpu-dkms
    validate: dkms

  bt-dkms:
    description: CIX Bluetooth DKMS package
    builder: debian
    flow: quilt
    source: sources/rtl-bt-driver
    source_git: sources/rtl-bt-driver
    debian: debian/bt-dkms
    validate: dkms

  vpu-dkms:
    description: VPU DKMS package
    builder: debian
    flow: quilt
    source: sources/vpu-driver
    source_git: sources/vpu-driver
    debian: debian/vpu-dkms
    validate: dkms

  vpu-firmware:
    description: Proprietary VPU firmware package
    builder: debian
    flow: payload
    source: sources/cix-proprietary/cix_proprietary-debs/cix-vpu-umd/usr/lib/firmware
    source_git: sources/cix-proprietary
    debian: debian/vpu-firmware
    payload_dir: firmware
    files:
      - av1dec.fwb
      - avs2dec.fwb
      - avsdec.fwb
      - h264dec.fwb
      - h264enc.fwb
      - hevcdec.fwb
      - hevcenc.fwb
      - jpegdec.fwb
      - jpegenc.fwb
      - mpeg2dec.fwb
      - mpeg4dec.fwb
      - vc1dec.fwb
      - vp8dec.fwb
      - vp8enc.fwb
      - vp9dec.fwb
      - vp9enc.fwb
    lfs: true

  npu-dkms:
    description: NPU DKMS package
    builder: debian
    flow: quilt
    source: sources/npu-driver/driver
    source_git: sources/npu-driver
    debian: debian/npu-dkms
    validate: dkms

  grub-config:
    description: CIX GRUB configuration package
    builder: debian
    flow: native
    source_git: debian
    debian: debian/grub-config

  alsa-conf:
    description: CIX ALSA UCM configuration package
    builder: debian
    flow: native
    source_git: debian
    debian: debian/alsa-conf

  cix-env:
    description: CIX system environment package
    builder: debian
    flow: native
    source_git: debian
    debian: debian/cix-env

  cix-firmware:
    description: CIX device firmware package
    builder: debian
    flow: payload
    source: sources/cix-proprietary/cix_module_fw
    source_git: sources/cix-proprietary
    debian: debian/cix-firmware
    payload_dir: firmware
    files:
      - sfh_fw=firmware
      - wlan_fw/fc6xe=firmware
      - bt_fw/rtl8852bu_fw=firmware/rtl8852bu_fw
      - bt_fw/rtl8852bu_config=firmware/rtl8852bu_config
      - bt_fw/qca=firmware/qca
    required_files:
      - sfh_fw/sfh_fw.bin
      - sfh_fw/sfh_fw_i3c.bin
      - sfh_fw/sfh_fw_sensor.bin
      - sfh_fw/sfh_fw_wakeup.bin
      - wlan_fw/fc6xe/Data.msc
      - wlan_fw/fc6xe/amss.bin
      - wlan_fw/fc6xe/bdwlan.elf
      - wlan_fw/fc6xe/bdwlang.elf
      - wlan_fw/fc6xe/m3.bin
      - wlan_fw/fc6xe/regdb.bin
      - wlan_fw/fc6xe/wlan/qcom_cfg.ini
      - bt_fw/rtl8852bu_fw
      - bt_fw/rtl8852bu_config
      - bt_fw/qca/hpbtfw21.tlv
      - bt_fw/qca/hpnv21.bin
      - bt_fw/qca/hpnv21.nvm
      - bt_fw/qca/hpnv21g.bin
    lfs: true

  audio-dsp:
    description: CIX audio DSP package
    builder: debian
    flow: payload
    source: sources/cix-proprietary/cix_proprietary-debs/cix-audio-dsp
    source_git: sources/cix-proprietary
    debian: debian/audio-dsp
    files: ["usr=usr"]
    lfs: true

  dpu-ddk:
    description: CIX DPU DDK package
    builder: debian
    flow: payload
    source: sources/cix-proprietary/cix_proprietary-debs/cix-dpu-ddk
    source_git: sources/cix-proprietary
    debian: debian/dpu-ddk
    files: ["usr=usr"]
    lfs: true

  gpu-umd:
    description: CIX GPU userspace package
    builder: debian
    flow: payload
    source: sources/cix-proprietary/cix_proprietary-debs/cix-gpu-umd
    source_git: sources/cix-proprietary
    debian: debian/gpu-umd
    files:
      - etc/ld.so.conf.d=etc/ld.so.conf.d
      - etc/vulkan=etc/vulkan
      - lib/firmware=usr/lib/firmware
      - lib/udev=usr/lib/udev
      - opt=opt
      - usr=usr
    lfs: true

  libdrm:
    description: CIX DRM userspace library package
    builder: debian
    flow: quilt
    source: sources/libdrm
    source_git: sources/libdrm
    debian: debian/libdrm

  libglvnd:
    description: CIX private GL dispatch library package
    builder: debian
    flow: quilt
    source: sources/libglvnd
    source_git: sources/libglvnd
    debian: debian/libglvnd

  mesa:
    description: CIX Mesa compatibility package
    builder: debian
    flow: quilt
    source: sources/mesa
    source_git: sources/mesa
    debian: debian/mesa

  libva:
    description: CIX VA-API library packages
    builder: debian
    flow: quilt
    source: sources/libva
    source_git: sources/libva
    debian: debian/libva

  ffmpeg:
    description: CIX FFmpeg multimedia packages
    builder: debian
    flow: quilt
    source: sources/ffmpeg
    source_git: sources/ffmpeg
    debian: debian/ffmpeg

  libcme:
    description: CIX Media Engine packages
    builder: debian
    flow: quilt
    source: sources/video-processing/libcme
    source_git: sources/video-processing
    debian: debian/libcme

  cix-vaapi:
    description: CIX VA-API hardware video driver
    builder: debian
    flow: quilt
    source: sources/cix-vaapi
    source_git: sources/cix-vaapi
    debian: debian/cix-vaapi

  isp-v4l2-dkms:
    description: CIX ISP V4L2 DKMS package
    builder: debian
    flow: quilt
    source: sources/isp-driver-v4l2
    source_git: sources/isp-driver-v4l2
    debian: debian/isp-v4l2-dkms
    validate: dkms

  isp-dkms:
    description: CIX ISP kernel-tree DKMS package
    builder: debian
    flow: quilt
    source: sources/linux/drivers/media/platform/cix/cix_isp
    source_git: sources/linux
    debian: debian/isp-dkms
    validate: dkms

  isp-umd:
    description: CIX ISP userspace package
    builder: debian
    flow: payload
    source: sources/cix-proprietary/cix_proprietary-debs/cix-isp-umd
    source_git: sources/cix-proprietary
    debian: debian/isp-umd
    files: ["usr=usr"]
    lfs: true

  noe-umd:
    description: CIX NOE userspace package
    builder: debian
    flow: payload
    source: sources/cix-proprietary/cix_proprietary-debs/cix-noe-umd
    source_git: sources/cix-proprietary
    debian: debian/noe-umd
    files: ["usr=usr"]
    lfs: true

  ai-engine:
    description: CIX unified AI inference engine
    builder: debian
    flow: quilt
    source: sources/cix-ai-engine
    source_git: sources/cix-ai-engine
    debian: debian/ai-engine

  mnn:
    description: CIX MNN inference runtime
    builder: debian
    flow: quilt
    source: sources/mnn
    source_git: sources/mnn
    debian: debian/mnn

  gstreamer-6.6:
    description: CIX GStreamer runtime overlay for Linux 6.6
    builder: debian
    flow: quilt
    source: sources/gstreamer
    source_git: sources/gstreamer
    debian: debian/gstreamer

  gstreamer-base-7.0:
    description: Debian GStreamer base with CIX Linux 7.0 patches
    builder: debian
    flow: debian-git
    source: sources/debian/gst-plugins-base1.0
    debian: debian/gstreamer-base-7.0

  gstreamer-good-7.0:
    description: Debian GStreamer good with CIX Linux 7.0 patches
    builder: debian
    flow: debian-git
    source: sources/debian/gst-plugins-good1.0
    debian: debian/gstreamer-good-7.0

  nnstreamer:
    description: CIX NNStreamer runtime
    builder: debian
    flow: quilt
    source: sources/nnstreamer
    source_git: sources/nnstreamer
    source_excludes: [demo, tests/test_models]
    debian: debian/nnstreamer

  wlan-dkms:
    description: CIX QCA and Realtek WLAN DKMS package
    builder: debian
    flow: quilt
    source: sources/wlan-qca
    source_git: sources/wlan-qca
    source_excludes: [AIO/apps, AIO/rootfs, AIO/drivers/fw-api/hostap]
    source_overlays:
      - sources/wlan-rtl=rtl-wlan
    debian: debian/wlan-dkms
    validate: dkms

  npu-umd:
    description: CIX NPU userspace package
    builder: debian
    flow: payload
    source: sources/cix-proprietary/cix_proprietary-debs/cix-npu-umd
    source_git: sources/cix-proprietary
    debian: debian/npu-umd
    files: ["usr=usr"]
    lfs: true

projects:
  cix_opensource/cix_unit_test:
    path: sources/cix-unit-test
    rules:
      - paths: ["**"]
        targets: [cix-test-tools]

  cix_test/ltp_opensource:
    path: sources/ltp
    rules:
      - paths: ["**"]
        targets: [ltp]

  linux_repo/cix_ramparser:
    path: sources/ramparser
    rules:
      - paths: ["**"]
        targets: [ramparser]

  cix_opensource/arm-trusted-firmware:
    path: sources/secure-firmware/bsp/tf-a
    rules:
      - paths: ["**"]
        targets: [sky1-tf-a]

  cix_opensource/cix_tfa:
    path: sources/secure-firmware/bsp/cix_tfa
    rules:
      - paths: ["**"]
        targets: [sky1-pbl]

  cix_opensource/mbedtls:
    path: sources/secure-firmware/bsp/mbedtls
    rules:
      - paths: ["**"]
        targets: [sky1-pbl, sky1-tf-a]

  cix_opensource/tee/op-tee:
    path: sources/secure-firmware/bsp/tee
    rules:
      - paths: ["**"]
        targets: [sky1-optee]

  cix_private/edk2:
    path: sources/uefi-development/edk2
    rules:
      - paths: ["**"]
        targets: *uefi_development_targets
      - paths: ["**"]
        targets: [uefi-stmm]

  cix_private/edk2-platforms:
    path: sources/uefi-development/edk2-platforms
    rules:
      - paths: ["**"]
        targets: *uefi_development_targets
      - paths: ["**"]
        targets: [uefi-stmm]

  tools/cix_binary:
    path: sources/cix-binary
    rules:
      - paths: ["device/misc/**"]
        targets: [pmtool]
      - paths: ["host/security/sky1/**"]
        targets: [radxa-o6-firmware-engineering]
    ignore:
      - "debug-tools/**"
      - "device/fct_test/**"
      - "device/images/**"
      - "device/openssl/**"
      - "device/sysdump/**"
      - "device/vendor_misc/**"
      - "host/fct_test/**"
      - "host/flash_tool/**"
      - "host/openssl/**"
      - "host/packagetool/**"
      - "host/pm_env/**"
      - "host/rkms/**"
      - "host/security/sky1p/**"
      - "host/security/star1/**"

  cix_opensource/linux:
    path: sources/linux
    rules:
      - paths: ["drivers/media/platform/cix/cix_isp/**"]
        targets: [isp-dkms]
      - paths: ["**"]
        targets: [kernel, ramparser]

  cix-linux-main:
    path: sources/linux-main
    rules:
      - paths: ["**"]
        targets: [stable-kernel]

  github_mirror/thesofproject/crosstool-ng:
    path: sources/audio-sof/crosstool-ng
    rules:
      - paths: ["**"]
        targets: [audio-sof]

  github_mirror/jcmvbkbc/newlib-xtensa:
    path: sources/audio-sof/newlib-xtensa
    rules:
      - paths: ["**"]
        targets: [audio-sof]

  github_mirror/thesofproject/sof:
    path: sources/audio-sof/sof
    rules:
      - paths: ["**"]
        targets: [audio-sof]

  github_mirror/thesofproject/tomlc99:
    path: sources/audio-sof/tomlc99
    rules:
      - paths: ["**"]
        targets: [audio-sof]

  github_mirror/thesofproject/xtensa-overlay:
    path: sources/audio-sof/xtensa-overlay
    rules:
      - paths: ["**"]
        targets: [audio-sof]

  cix_opensource/release/edk2:
    path: sources/radxa-o6/uefi_release/edk2
    rules:
      - paths: ["**"]
        targets: &sky1_firmware_targets [radxa-o6-firmware, radxa-o6n-firmware, sky1-merak-firmware, sky1-edge-firmware, radxa-o6-firmware-engineering]

  cix_opensource/release/edk2-non-osi:
    path: sources/radxa-o6/uefi_release/edk2-non-osi
    rules:
      - paths: ["**"]
        targets: *sky1_firmware_targets

  cix_opensource/release/edk2-platforms:
    path: sources/radxa-o6/uefi_release/edk2-platforms
    rules:
      - paths: ["**"]
        targets: *sky1_firmware_targets

  cix_private/acpica:
    path: sources/radxa-o6/uefi_release/tools/acpica
    rules:
      - paths: ["**"]
        targets: &all_uefi_targets [radxa-o6-firmware, radxa-o6n-firmware, sky1-merak-firmware, sky1-edge-firmware, radxa-o6-firmware-engineering, sky1-emu-uefi, sky1-fpga-uefi, sky1-merak-uefi, sky1p-emu-uefi, sky1p-fpga-uefi, sky1p-evb-uefi, sky1p-crb1-uefi, sky1p-crb2-uefi, star1-emu-uefi, star1-fpga-uefi, star1-merak-uefi]

  cix_proprietary/cix_bsp_release:
    path: sources/radxa-o6/cix_bsp_release
    rules:
      - paths: ["**"]
        targets: *sky1_firmware_targets

  cix_security/ddr:
    path: sources/radxa-o6/bootloader/ddr
    rules:
      - paths: ["**"]
        targets: [radxa-o6-firmware-engineering, sky1-se-firmware]

  cix_security/firmware:
    path: sources/radxa-o6/bootloader/firmware
    rules:
      - paths: ["**"]
        targets: [radxa-o6-firmware-engineering, sky1-se-firmware]

  cix_security/library:
    path: sources/radxa-o6/bootloader/library
    rules:
      - paths: ["**"]
        targets: [radxa-o6-firmware-engineering, sky1-se-firmware, sky1-pbl, sky1-tf-a]

  cix_private/sw_tools_private:
    path: sources/radxa-o6/bootloader/sw-tools-private
    rules:
      - paths: ["**"]
        targets: [radxa-o6-firmware-engineering]

  cix_proprietary/cix_firmware:
    path: sources/radxa-o6/bootloader/firmware-binaries
    rules:
      - paths: ["**"]
        targets: [radxa-o6-firmware-engineering]

  github_mirror/ucb-bar/berkeley-softfloat-3:
    path: sources/uefi-stmm/edk2/ArmPkg/Library/ArmSoftFloatLib/berkeley-softfloat-3
    rules:
      - paths: ["**"]
        targets: [uefi-stmm]

  github_mirror/google/brotli:
    path: sources/radxa-o6/uefi_release/edk2/BaseTools/Source/C/BrotliCompress/brotli
    rules:
      - paths: ["**"]
        targets: *all_uefi_targets
      - paths: ["**"]
        targets: [uefi-stmm]

  github_mirror/ARMmbed/mbedtls:
    path: sources/radxa-o6/uefi_release/edk2/CryptoPkg/Library/MbedTlsLib/mbedtls
    rules:
      - paths: ["**"]
